extends:
  - theme-check:recommended

ignore:
  - ".github/**"
  - "docs/**"
  - "scripts/**"
  - "node_modules/**"
  - "test-results/**"
  - "coverage/**"

OrphanedSnippet:
  ignore:
    - "snippets/rhino-icon.liquid"
    # product.json custom_liquid render strings are verified by validate:epic-g-products.
    - "snippets/rhino-g-product-detail.liquid"
    - "snippets/rhino-g-product-fit.liquid"
