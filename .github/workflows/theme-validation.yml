name: Theme validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

concurrency:
  group: theme-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Theme Check
        uses: shopify/theme-check-action@v2.2.0
        with:
          theme_root: "."
          flags: "--fail-level warning"
          token: ${{ github.token }}

  repository-validation:
    name: JSON and repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate repository
        run: python scripts/validate-theme-repository.py